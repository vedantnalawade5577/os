name: Advanced AOSP Cloud Build Workflow

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout Repository Code
    uses: actions/checkout@v4

  - name: Maximize Disk Space
    run: |
      sudo rm -rf /usr/share/dotnet
      sudo rm -rf /usr/local/lib/android
      sudo rm -rf /opt/ghc
      sudo rm -rf "/usr/local/share/boost"
      sudo rm -rf /usr/share/swift
      sudo apt-get clean
      df -h

  - name: Install Build Dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y openjdk-17-jdk git-core gnupg flex bison build-essential \
      zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 \
      libncurses5-dev lib32ncurses-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
      libxml2-utils xsltproc unzip fontconfig rsync python3 git

  - name: Setup Repo Tool
    run: |
      mkdir -p ~/.bin
      curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
      chmod a+rx ~/.bin/repo
      echo "$HOME/.bin" >> $GITHUB_PATH

  - name: Configure Git Identity
    run: |
      git config --global user.name "AOSP Builder"
      git config --global user.email "builder@example.com"

  - name: Run Build Process
    run: |
      mkdir -p ~/aosp_workspace && cd ~/aosp_workspace
      echo "Workspace prepared and ready for build execution!"

  - name: Upload Build Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: advanced-aosp-build-output
      path: ~/aosp_workspace/out/target/product/*/
